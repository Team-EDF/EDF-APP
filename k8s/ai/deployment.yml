apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-depl
  namespace: edf
  labels:
    app: ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai
  template:
    metadata:
      labels:
        app: ai
    spec:
      serviceAccountName: ai-service-account
      containers:
      - name: ai-container
        image: 398875891485.dkr.ecr.ap-northeast-2.amazonaws.com/edf-ai:82f2b20
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8000
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: '1'
            memory: 1Gi
        env:
        - name: SERVER_PORT
          valueFrom:
            configMapKeyRef:
              name: ai-config
              key: SERVER_PORT
        - name: APP_ENV
          valueFrom:
            configMapKeyRef:
              name: ai-config
              key: APP_ENV
        - name: DB_HOST
          valueFrom:
            secretKeyRef:
              name: ai-secret
              key: DB_HOST
        - name: DB_PORT
          valueFrom:
            secretKeyRef:
              name: ai-secret
              key: DB_PORT
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: ai-secret
              key: DB_NAME
        - name: DB_USERNAME
          valueFrom:
            secretKeyRef:
              name: ai-secret
              key: DB_USERNAME
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ai-secret
              key: DB_PASSWORD
        - name: DB_USER
          value: $(DB_USERNAME)
        - name: DB_PASS
          value: $(DB_PASSWORD)
        - name: PGSSLMODE
          value: require
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: ai-secret
              key: OPENAI_API_KEY
              optional: true
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          periodSeconds: 20
          timeoutSeconds: 3
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /health
            port: 8000
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 30
  revisionHistoryLimit: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
