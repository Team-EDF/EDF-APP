apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-depl
  namespace: edf
  labels:
    app: ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai
  template:
    metadata:
      labels:
        app: ai
    spec:
      containers:
        - name: ai-container
          image: 398875891485.dkr.ecr.ap-northeast-2.amazonaws.com/edf-ai:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000

          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"

          env:
            - name: SERVER_PORT
              valueFrom:
                configMapKeyRef:
                  name: ai-config
                  key: SERVER_PORT
            - name: APP_ENV
              valueFrom:
                configMapKeyRef:
                  name: ai-config
                  key: APP_ENV
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ai-secret
                  key: OPENAI_API_KEY
                  optional: true

          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 40
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3