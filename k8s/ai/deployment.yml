apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-depl
  namespace: edf
  labels:
    app: ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai
  template:
    metadata:
      labels:
        app: ai
    spec:
      serviceAccountName: ai-service-account
      containers:
      - name: ai-container
        image: 398875891485.dkr.ecr.ap-northeast-2.amazonaws.com/edf-ai:82f2b20
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8000
        resources:
          requests:
            cpu: 250m
            memory: 1Gi
          limits:
            cpu: '1'
            memory: 3Gi
        env:
        - name: SERVER_PORT
          valueFrom:
            configMapKeyRef:
              name: ai-config
              key: SERVER_PORT
        - name: APP_ENV
          valueFrom:
            configMapKeyRef:
              name: ai-config
              key: APP_ENV
        - name: DB_HOST
          valueFrom:
            secretKeyRef:
              name: ai-secret
              key: DB_HOST
        - name: DB_PORT
          valueFrom:
            secretKeyRef:
              name: ai-secret
              key: DB_PORT
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: ai-secret
              key: DB_NAME
        - name: DB_USERNAME
          valueFrom:
            secretKeyRef:
              name: ai-secret
              key: DB_USERNAME
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ai-secret
              key: DB_PASSWORD
        - name: DB_USER
          value: $(DB_USERNAME)
        - name: DB_PASS
          value: $(DB_PASSWORD)
        - name: PGSSLMODE
          value: require
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: ai-secret
              key: OPENAI_API_KEY
              optional: true
        - name: SBERT_MODEL_PATH
          valueFrom:
            configMapKeyRef:
              name: ai-config
              key: SBERT_MODEL_PATH
        - name: S3_BUCKET_NAME
          valueFrom:
            configMapKeyRef:
              name: ai-config
              key: S3_BUCKET_NAME
        - name: S3_UPLOAD_PREFIX
          valueFrom:
            configMapKeyRef:
              name: ai-config
              key: S3_UPLOAD_PREFIX
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          periodSeconds: 20
          timeoutSeconds: 3
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /health
            port: 8000
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 30
        volumeMounts:
        - name: sbert-model
          mountPath: /app/app/services/greenstep_sbert_v2
          readOnly: true
      initContainers:
      - name: sbert-model-loader
        image: public.ecr.aws/aws-cli/aws-cli:2.36.24
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        - -c
        args:
        - "set -eu\nMODEL_URI=\"s3://${SBERT_S3_BUCKET}/${SBERT_S3_PREFIX}/\"\n\n\
          echo \"Downloading SBERT model from ${MODEL_URI}\"\nrm -rf /model/*\naws\
          \ s3 sync \"${MODEL_URI}\" /model/ --only-show-errors\n\nif [ ! -f /model/modules.json\
          \ ]; then\n  echo \"ERROR: /model/modules.json was not downloaded.\"\n \
          \ echo \"Expected S3 key: ${SBERT_S3_PREFIX}/modules.json\"\n  find /model\
          \ -maxdepth 3 -type f | head -100 || true\n  exit 1\nfi\n\necho \"SBERT\
          \ model download completed.\"\ndu -sh /model || true\n"
        env:
        - name: SBERT_S3_BUCKET
          valueFrom:
            configMapKeyRef:
              name: ai-config
              key: SBERT_S3_BUCKET
        - name: SBERT_S3_PREFIX
          valueFrom:
            configMapKeyRef:
              name: ai-config
              key: SBERT_S3_PREFIX
        - name: AWS_REGION
          value: ap-northeast-2
        - name: AWS_DEFAULT_REGION
          value: ap-northeast-2
        volumeMounts:
        - name: sbert-model
          mountPath: /model
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 512Mi
      volumes:
      - name: sbert-model
        emptyDir: {}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - backend
                  - redis
              topologyKey: kubernetes.io/hostname
  revisionHistoryLimit: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
