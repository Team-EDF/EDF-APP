apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: edf
data:
  SERVER_PORT: "8080"

  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"

  AI_SERVICE_URL: "http://ai-service:8000"

  # Naver API HUB news search endpoint (not a credential)
  NAVER_NEWS_API_URL: "https://naverapihub.apigw.ntruss.com/search/v1/news"

  JWT_ACCESS_EXP: "3600"
  JWT_REFRESH_EXP: "604800"

  FILE_UPLOAD_DIR: "/app/uploads"

  # Private S3 user-upload configuration
  AWS_REGION: "ap-northeast-2"
  S3_BUCKET_NAME: "edf-user-uploads-edf-556988669310"
  S3_UPLOAD_PREFIX: "receipts"

  # Abuse-prevention limits introduced by the latest Backend.
  ACTIVITY_DAILY_LIMIT_PER_CATEGORY: "2"
  ACTIVITY_DAILY_LIMIT_TOTAL: "6"
  ACTIVITY_IMAGE_MAX_AGE_HOURS: "24"
  TRANSIT_DAILY_LIMIT: "6"
