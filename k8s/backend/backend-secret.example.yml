apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  namespace: edf
type: Opaque
stringData:
  DB_URL: "jdbc:postgresql://YOUR_RDS_ENDPOINT:5432/edf_db"
  DB_USERNAME: "edf_admin"
  DB_PASSWORD: "CHANGE_ME"

  JWT_SECRET: "CHANGE_ME"

  ADMIN_EMAIL: "admin@example.com"
  ADMIN_PASSWORD: "CHANGE_ME"

  MAIL_USERNAME: "CHANGE_ME"
  MAIL_APP_PASSWORD: "CHANGE_ME"

  # Google Web application OAuth Client ID (ID-token aud)
  GOOGLE_CLIENT_ID: "CHANGE_ME"

  GOOGLE_API_KEY: "CHANGE_ME"
