apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  namespace: edf
type: Opaque
stringData:
  DB_HOST: "YOUR_RDS_ENDPOINT"
  DB_PORT: "5432"
  DB_NAME: "edf_db"
  DB_USERNAME: "edf_admin"
  DB_PASSWORD: "CHANGE_ME"

  JWT_SECRET: "CHANGE_ME"

  MAIL_USERNAME: "CHANGE_ME"
  MAIL_APP_PASSWORD: "CHANGE_ME"

  GOOGLE_CLIENT_ID: "CHANGE_ME"
  GOOGLE_CLIENT_SECRET: "CHANGE_ME"

  NAVER_CLIENT_ID: "CHANGE_ME"
  NAVER_CLIENT_SECRET: "CHANGE_ME"

  KAKAO_CLIENT_ID: "CHANGE_ME"
  KAKAO_CLIENT_SECRET: "CHANGE_ME"

  GOOGLE_API_KEY: "CHANGE_ME"
  KAKAO_API_KEY: "CHANGE_ME"

  COOLSMS_API_KEY: "CHANGE_ME"
  COOLSMS_API_SECRET: "CHANGE_ME"
  COOLSMS_SENDER: "CHANGE_ME"

  # Optional environmental-news collection.
  # Leave all three empty if the feature is not enabled yet.
  NAVER_API_HUB_CLIENT_ID: ""
  NAVER_API_HUB_CLIENT_SECRET: ""
  NAVER_NEWS_API_URL: ""
