apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: frontend-app
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/Team-EDF/EDF-APP.git
    targetRevision: main
    path: k8s/frontend

  destination:
    server: https://kubernetes.default.svc
    namespace: edf

  syncPolicy:
    automated:
      prune: true
      selfHeal: true