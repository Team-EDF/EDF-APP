services:
  postgres:
    image: postgres:16
    container_name: edf-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - edf_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: edf-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  edf_postgres_data: