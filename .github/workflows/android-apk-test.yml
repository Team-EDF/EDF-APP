name: Build GreenStep Test APK

on:
  workflow_dispatch:
    inputs:
      frontend_ref:
        description: "EDF-FE branch/tag/commit to build"
        required: true
        default: "main"

permissions:
  contents: read

jobs:
  build-test-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout EDF-APP
        uses: actions/checkout@v4

      - name: Checkout EDF-FE
        uses: actions/checkout@v4
        with:
          repository: Team-EDF/EDF-FE
          ref: ${{ inputs.frontend_ref }}
          token: ${{ secrets.GH_PAT }}
          path: frontend/EDF-FE

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/EDF-FE/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.1.12297006"

      - name: Validate environment
        shell: bash
        env:
          BASE_URL: ${{ vars.ANDROID_BASE_URL }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          KAKAO_NATIVE_APP_KEY: ${{ secrets.KAKAO_NATIVE_APP_KEY }}
        run: |
          set -euo pipefail

          test -n "${BASE_URL:-}" || {
            echo "::error::ANDROID_BASE_URL variable is missing"
            exit 1
          }

          for name in \
            GOOGLE_CLIENT_ID \
            GOOGLE_MAPS_API_KEY \
            NAVER_CLIENT_ID \
            NAVER_CLIENT_SECRET \
            KAKAO_NATIVE_APP_KEY
          do
            test -n "${!name:-}" || {
              echo "::error::Missing secret: ${name}"
              exit 1
            }
          done

      - name: Install dependencies
        working-directory: frontend/EDF-FE
        run: npm ci

      - name: Create test .env
        working-directory: frontend/EDF-FE
        shell: bash
        env:
          BASE_URL: ${{ vars.ANDROID_BASE_URL }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          KAKAO_NATIVE_APP_KEY: ${{ secrets.KAKAO_NATIVE_APP_KEY }}
        run: |
          cat > .env <<EOF
          BASE_URL=${BASE_URL}
          GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
          GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY}
          NAVER_CLIENT_ID=${NAVER_CLIENT_ID}
          NAVER_CLIENT_SECRET=${NAVER_CLIENT_SECRET}
          KAKAO_NATIVE_APP_KEY=${KAKAO_NATIVE_APP_KEY}
          KAKAO_APP_KEY=${KAKAO_NATIVE_APP_KEY}
          EOF

      - name: Sync native Android environment
        working-directory: frontend/EDF-FE
        shell: bash
        run: |
          if [[ -f scripts/sync-env.js ]]; then
            node scripts/sync-env.js
          fi

      - name: Build debug APK
        working-directory: frontend/EDF-FE/android
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew clean assembleDebug --no-daemon

      - name: Verify APK
        shell: bash
        run: |
          APK="frontend/EDF-FE/android/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          ls -lh "$APK"
          sha256sum "$APK" | tee greenstep-test-apk.sha256

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: greenstep-test-apk-${{ github.run_number }}
          path: |
            frontend/EDF-FE/android/app/build/outputs/apk/debug/app-debug.apk
            greenstep-test-apk.sha256
          if-no-files-found: error
          retention-days: 14
