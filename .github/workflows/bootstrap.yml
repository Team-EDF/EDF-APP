name: Bootstrap EDF Platform

on:
  workflow_dispatch:
    inputs:
      repair_lbc_webhook:
        description: "AWS Load Balancer Controller Webhook 인증서 복구"
        required: true
        default: false
        type: boolean
      install_observability:
        description: "Metrics Server + Prometheus 모니터링 설치 (첫 배포에서는 false 권장)"
        required: true
        default: false
        type: boolean

concurrency:
  group: edf-platform-bootstrap
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-2
  EKS_CLUSTER_NAME: edf-cluster
  AWS_LBC_CHART_VERSION: "3.3.0"

  EDF_NAMESPACE: edf
  ARGOCD_NAMESPACE: argocd
  MONITORING_NAMESPACE: monitoring
  EDF_INGRESS_NAME: edf-api-ingress

jobs:
  bootstrap:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout EDF-APP
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Validate required bootstrap values
        env:
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

          JWT_SECRET: ${{ secrets.JWT_SECRET }}

          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_APP_PASSWORD: ${{ secrets.MAIL_APP_PASSWORD }}

          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}

          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}

          KAKAO_CLIENT_ID: ${{ secrets.KAKAO_CLIENT_ID }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}

          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          KAKAO_API_KEY: ${{ secrets.KAKAO_API_KEY }}

          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_USERNAME: ${{ vars.USER_NAME }}
          GITOPS_REPOSITORY: ${{ vars.REPO }}

        shell: bash
        run: |
          set -euo pipefail

          required_names=(
            AWS_ROLE_ARN
            DB_HOST
            DB_PORT
            DB_NAME
            DB_USERNAME
            DB_PASSWORD
            JWT_SECRET
            MAIL_USERNAME
            MAIL_APP_PASSWORD
            GOOGLE_CLIENT_ID
            GOOGLE_CLIENT_SECRET
            NAVER_CLIENT_ID
            NAVER_CLIENT_SECRET
            KAKAO_CLIENT_ID
            KAKAO_CLIENT_SECRET
            GOOGLE_API_KEY
            KAKAO_API_KEY
            OPENAI_API_KEY
            GH_PAT
            GITHUB_USERNAME
            GITOPS_REPOSITORY
          )

          for name in "${required_names[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Required GitHub Secret or Variable is missing: ${name}"
              exit 1
            fi
          done

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Update EKS kubeconfig
        shell: bash
        run: |
          set -euo pipefail

          aws eks update-kubeconfig \
            --region "${AWS_REGION}" \
            --name "${EKS_CLUSTER_NAME}"

      - name: Verify EKS access and worker readiness
        shell: bash
        run: |
          set -euo pipefail

          kubectl cluster-info
          kubectl get nodes -L node.kubernetes.io/instance-type
          kubectl get nodes \
            -o custom-columns='NAME:.metadata.name,TYPE:.metadata.labels.node\.kubernetes\.io/instance-type,READY:.status.conditions[?(@.type=="Ready")].status,POD_CAPACITY:.status.capacity.pods'

          if [[ "$(kubectl auth can-i create namespace)" != "yes" ]]; then
            echo "::error::The GitHub Actions role does not have sufficient EKS permissions."
            exit 1
          fi

          TOTAL_NODES="$(kubectl get nodes --no-headers | wc -l | tr -d ' ')"
          READY_NODES="$(kubectl get nodes --no-headers | awk '$2 == "Ready" {count++} END {print count+0}')"

          echo "Ready worker nodes: ${READY_NODES}/${TOTAL_NODES}"

          # First-deploy profile expects two fixed workers. Fail early instead of
          # spending 10 minutes in an application rollout that cannot schedule.
          if [[ "${READY_NODES}" -lt 2 || "${READY_NODES}" -ne "${TOTAL_NODES}" ]]; then
            echo "::error::All worker nodes must be Ready and at least two Ready nodes are required before bootstrap."
            kubectl get nodes -o wide
            exit 1
          fi

          # CNI must be healthy before application Pods are created.
          kubectl rollout status daemonset/aws-node \
            -n kube-system \
            --timeout=5m

      - name: Resolve EKS VPC and validate ALB subnets
        shell: bash
        run: |
          set -euo pipefail

          VPC_ID="$(
            aws eks describe-cluster \
              --region "${AWS_REGION}" \
              --name "${EKS_CLUSTER_NAME}" \
              --query 'cluster.resourcesVpcConfig.vpcId' \
              --output text
          )"

          if [[ -z "${VPC_ID}" || "${VPC_ID}" == "None" ]]; then
            echo "::error::Could not resolve the VPC ID from EKS cluster ${EKS_CLUSTER_NAME}."
            exit 1
          fi

          echo "Resolved EKS VPC: ${VPC_ID}"
          echo "VPC_ID=${VPC_ID}" >> "${GITHUB_ENV}"

          PUBLIC_SUBNET_COUNT="$(
            aws ec2 describe-subnets \
              --region "${AWS_REGION}" \
              --filters \
                "Name=vpc-id,Values=${VPC_ID}" \
                "Name=tag:kubernetes.io/role/elb,Values=1" \
              --query 'length(Subnets)' \
              --output text
          )"

          echo "ALB-discoverable public subnets: ${PUBLIC_SUBNET_COUNT}"

          if [[ "${PUBLIC_SUBNET_COUNT}" -lt 2 ]]; then
            echo "::error::At least two public subnets tagged kubernetes.io/role/elb=1 are required for the internet-facing ALB. Found ${PUBLIC_SUBNET_COUNT} in ${VPC_ID}."
            exit 1
          fi

      - name: Create required platform namespaces
        shell: bash
        run: |
          set -euo pipefail

          for namespace in "${EDF_NAMESPACE}" "${ARGOCD_NAMESPACE}"; do
            kubectl create namespace "${namespace}" \
              --dry-run=client \
              -o yaml | kubectl apply -f -
          done

          if [[ "${{ inputs.install_observability }}" == "true" ]]; then
            kubectl create namespace "${MONITORING_NAMESPACE}" \
              --dry-run=client \
              -o yaml | kubectl apply -f -
          fi

      - name: Remove observability workloads for lean first deploy
        if: ${{ inputs.install_observability != true }}
        shell: bash
        run: |
          set -euo pipefail

          # These workloads are useful later, but are not required for the first
          # server deployment. Removing them frees Pod/IP slots and memory.
          helm uninstall monitoring \
            -n "${MONITORING_NAMESPACE}" \
            --ignore-not-found || true

          kubectl delete deployment metrics-server \
            -n kube-system \
            --ignore-not-found=true || true

          # Remove the standalone kube-state-metrics Deployment previously
          # installed by bootstrap. kube-prometheus-stack provides its own copy
          # when observability is enabled.
          KSM_NAMESPACE="$(
            kubectl get deployment -A \
              -o jsonpath='{range .items[?(@.metadata.name=="kube-state-metrics")]}{.metadata.namespace}{"\n"}{end}' \
              2>/dev/null | head -n 1
          )"
          if [[ -n "${KSM_NAMESPACE}" ]]; then
            kubectl delete deployment kube-state-metrics \
              -n "${KSM_NAMESPACE}" \
              --ignore-not-found=true || true
          fi

          kubectl delete namespace "${MONITORING_NAMESPACE}" \
            --ignore-not-found=true \
            --wait=false || true

      - name: Install Metrics Server for optional observability
        if: ${{ inputs.install_observability == true }}
        shell: bash
        run: |
          set -euo pipefail

          kubectl apply -f \
            https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml

          kubectl rollout status deployment/metrics-server \
            -n kube-system \
            --timeout=5m

      - name: Verify AWS Load Balancer Controller service account
        shell: bash
        run: |
          set -euo pipefail

          kubectl get serviceaccount \
            aws-load-balancer-controller \
            -n kube-system

      # 현재처럼 TLS Secret과 Webhook caBundle이 어긋난 경우에만 실행한다.
      # 정상 배포에서는 repair_lbc_webhook=false로 둔다.
      - name: Repair AWS Load Balancer Controller webhook
        if: ${{ inputs.repair_lbc_webhook == true }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Removing inconsistent webhook certificate resources..."

          kubectl delete mutatingwebhookconfiguration \
            aws-load-balancer-webhook \
            --ignore-not-found=true

          kubectl delete validatingwebhookconfiguration \
            aws-load-balancer-webhook \
            --ignore-not-found=true

          kubectl delete secret \
            aws-load-balancer-tls \
            -n kube-system \
            --ignore-not-found=true

          echo "Webhook repair cleanup completed."

      - name: Install AWS Load Balancer Controller
        shell: bash
        run: |
          set -euo pipefail

          helm repo add eks \
            https://aws.github.io/eks-charts \
            --force-update

          helm repo update eks

          # Helm upgrade만으로 CRD가 항상 갱신되지는 않으므로
          # Controller 설치 전에 명시적으로 적용한다.
          kubectl apply -k \
            "github.com/aws/eks-charts/stable/aws-load-balancer-controller/crds?ref=master"

          KEEP_TLS_SECRET=true

          if [[ "${{ inputs.repair_lbc_webhook }}" == "true" ]]; then
            # 삭제한 인증서를 이번 설치에서 새로 생성한다.
            KEEP_TLS_SECRET=false
          fi

          helm upgrade --install aws-load-balancer-controller \
            eks/aws-load-balancer-controller \
            --namespace kube-system \
            --version "${AWS_LBC_CHART_VERSION}" \
            --set clusterName="${EKS_CLUSTER_NAME}" \
            --set serviceAccount.create=false \
            --set serviceAccount.name=aws-load-balancer-controller \
            --set region="${AWS_REGION}" \
            --set vpcId="${VPC_ID}" \
            --set replicaCount=1 \
            --set keepTLSSecret="${KEEP_TLS_SECRET}" \
            --atomic \
            --wait \
            --timeout 10m

          kubectl rollout status \
            deployment/aws-load-balancer-controller \
            -n kube-system \
            --timeout=5m

      - name: Verify AWS Load Balancer Controller webhook
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Controller Pods ==="

          kubectl get pods \
            -n kube-system \
            -l app.kubernetes.io/name=aws-load-balancer-controller \
            -o wide

          echo "=== Webhook Service ==="

          kubectl get service \
            aws-load-balancer-webhook-service \
            -n kube-system

          echo "=== Webhook Endpoints ==="

          ENDPOINTS="$(
            kubectl get endpoints \
              aws-load-balancer-webhook-service \
              -n kube-system \
              -o jsonpath='{.subsets[*].addresses[*].ip}'
          )"

          if [[ -z "${ENDPOINTS}" ]]; then
            echo "::error::AWS Load Balancer Controller webhook has no ready endpoints."
            exit 1
          fi

          echo "Webhook endpoints: ${ENDPOINTS}"

      - name: Test AWS Load Balancer Controller webhook
        shell: bash
        run: |
          set -euo pipefail

          TEST_NAMESPACE="aws-lbc-webhook-test"

          cleanup() {
            kubectl delete namespace \
              "${TEST_NAMESPACE}" \
              --ignore-not-found=true \
              --wait=false || true
          }

          trap cleanup EXIT

          kubectl create namespace "${TEST_NAMESPACE}" \
            --dry-run=client \
            -o yaml | kubectl apply -f -

          # Service 생성은 mservice.elbv2.k8s.aws Webhook을 실제 호출한다.
          kubectl create service clusterip webhook-test-service \
            --tcp=80:80 \
            -n "${TEST_NAMESPACE}" \
            --dry-run=client \
            -o yaml | kubectl apply -f -

          echo "AWS Load Balancer Controller webhook test passed."

      - name: Install ArgoCD
        shell: bash
        run: |
          set -euo pipefail

          kubectl apply \
            -n "${ARGOCD_NAMESPACE}" \
            -f https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml \
            --server-side \
            --force-conflicts

          kubectl wait \
            --for=condition=Established \
            crd/applications.argoproj.io \
            crd/applicationsets.argoproj.io \
            crd/appprojects.argoproj.io \
            --timeout=3m

          kubectl rollout status deployment/argocd-server \
            -n "${ARGOCD_NAMESPACE}" \
            --timeout=10m

          kubectl rollout status deployment/argocd-repo-server \
            -n "${ARGOCD_NAMESPACE}" \
            --timeout=10m

      - name: Disable ArgoCD Git submodule checkout
        shell: bash
        run: |
          set -euo pipefail

          # ArgoCD only consumes GitOps manifests from EDF-APP.
          # BE/AI/FE private submodules are fetched by GitHub Actions when needed.
          kubectl patch configmap argocd-cmd-params-cm \
            -n "${ARGOCD_NAMESPACE}" \
            --type merge \
            -p '{"data":{"reposerver.enable.git.submodule":"false"}}'

          kubectl rollout restart deployment/argocd-repo-server \
            -n "${ARGOCD_NAMESPACE}"

          kubectl rollout status deployment/argocd-repo-server \
            -n "${ARGOCD_NAMESPACE}" \
            --timeout=10m

          SUBMODULE_SETTING="$(
            kubectl get configmap argocd-cmd-params-cm \
              -n "${ARGOCD_NAMESPACE}" \
              -o jsonpath='{.data.reposerver\.enable\.git\.submodule}'
          )"

          if [[ "${SUBMODULE_SETTING}" != "false" ]]; then
            echo "::error::Failed to disable ArgoCD Git submodule checkout."
            exit 1
          fi

          echo "ArgoCD Git submodule checkout: ${SUBMODULE_SETTING}"

      - name: Create Backend Kubernetes Secret
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

          JWT_SECRET: ${{ secrets.JWT_SECRET }}

          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_APP_PASSWORD: ${{ secrets.MAIL_APP_PASSWORD }}

          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}

          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}

          KAKAO_CLIENT_ID: ${{ secrets.KAKAO_CLIENT_ID }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}

          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          KAKAO_API_KEY: ${{ secrets.KAKAO_API_KEY }}

        shell: bash
        run: |
          set -euo pipefail

          kubectl create secret generic backend-secret \
            --namespace "${EDF_NAMESPACE}" \
            --from-literal=DB_HOST="${DB_HOST}" \
            --from-literal=DB_PORT="${DB_PORT}" \
            --from-literal=DB_NAME="${DB_NAME}" \
            --from-literal=DB_USERNAME="${DB_USERNAME}" \
            --from-literal=DB_PASSWORD="${DB_PASSWORD}" \
            --from-literal=JWT_SECRET="${JWT_SECRET}" \
            --from-literal=MAIL_USERNAME="${MAIL_USERNAME}" \
            --from-literal=MAIL_APP_PASSWORD="${MAIL_APP_PASSWORD}" \
            --from-literal=GOOGLE_CLIENT_ID="${GOOGLE_CLIENT_ID}" \
            --from-literal=GOOGLE_CLIENT_SECRET="${GOOGLE_CLIENT_SECRET}" \
            --from-literal=NAVER_CLIENT_ID="${NAVER_CLIENT_ID}" \
            --from-literal=NAVER_CLIENT_SECRET="${NAVER_CLIENT_SECRET}" \
            --from-literal=KAKAO_CLIENT_ID="${KAKAO_CLIENT_ID}" \
            --from-literal=KAKAO_CLIENT_SECRET="${KAKAO_CLIENT_SECRET}" \
            --from-literal=GOOGLE_API_KEY="${GOOGLE_API_KEY}" \
            --from-literal=KAKAO_API_KEY="${KAKAO_API_KEY}" \
            --dry-run=client \
            -o yaml | kubectl apply -f -

      - name: Create AI Kubernetes Secret
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

        shell: bash
        run: |
          set -euo pipefail

          kubectl create secret generic ai-secret \
            --namespace "${EDF_NAMESPACE}" \
            --from-literal=DB_HOST="${DB_HOST}" \
            --from-literal=DB_PORT="${DB_PORT}" \
            --from-literal=DB_NAME="${DB_NAME}" \
            --from-literal=DB_USERNAME="${DB_USERNAME}" \
            --from-literal=DB_PASSWORD="${DB_PASSWORD}" \
            --from-literal=OPENAI_API_KEY="${OPENAI_API_KEY}" \
            --dry-run=client \
            -o yaml | kubectl apply -f -

      - name: Create ArgoCD repository Secret
        env:
          GITHUB_USERNAME: ${{ vars.USER_NAME }}
          GITOPS_REPO_URL: https://github.com/${{ vars.REPO }}.git
          GH_PAT: ${{ secrets.GH_PAT }}

        shell: bash
        run: |
          set -euo pipefail

          kubectl create secret generic gitops-repo-secret \
            --namespace "${ARGOCD_NAMESPACE}" \
            --from-literal=type=git \
            --from-literal=url="${GITOPS_REPO_URL}" \
            --from-literal=username="${GITHUB_USERNAME}" \
            --from-literal=password="${GH_PAT}" \
            --dry-run=client \
            -o yaml | kubectl apply -f -

          kubectl label secret gitops-repo-secret \
            -n "${ARGOCD_NAMESPACE}" \
            argocd.argoproj.io/secret-type=repository \
            --overwrite

      - name: Install optional monitoring stack
        if: ${{ inputs.install_observability == true }}
        shell: bash
        run: |
          set -euo pipefail

          helm repo add prometheus-community \
            https://prometheus-community.github.io/helm-charts
          helm repo update prometheus-community

          helm upgrade --install monitoring \
            prometheus-community/kube-prometheus-stack \
            --namespace "${MONITORING_NAMESPACE}" \
            --values k8s/monitoring/values.yml \
            --wait \
            --timeout 15m

      - name: Apply ArgoCD root application
        shell: bash
        run: |
          set -euo pipefail

          kubectl apply -f argocd/root-app.yaml

          kubectl get application root-app \
            -n "${ARGOCD_NAMESPACE}" \
            -o wide

      - name: Verify ArgoCD sync and ALB provisioning
        shell: bash
        run: |
          set -euo pipefail

          echo "Waiting for root-app to become Synced..."

          ROOT_SYNCED=false
          for attempt in $(seq 1 60); do
            SYNC_STATUS="$(
              kubectl get application root-app \
                -n "${ARGOCD_NAMESPACE}" \
                -o jsonpath='{.status.sync.status}' 2>/dev/null || true
            )"

            if [[ "${SYNC_STATUS}" == "Synced" ]]; then
              ROOT_SYNCED=true
              break
            fi

            sleep 5
          done

          if [[ "${ROOT_SYNCED}" != "true" ]]; then
            echo "::error::root-app did not reach Synced status."
            kubectl describe application root-app -n "${ARGOCD_NAMESPACE}" || true
            exit 1
          fi

          echo "Waiting for Ingress ${EDF_NAMESPACE}/${EDF_INGRESS_NAME}..."

          INGRESS_CREATED=false
          for attempt in $(seq 1 60); do
            if kubectl get ingress "${EDF_INGRESS_NAME}" \
              -n "${EDF_NAMESPACE}" >/dev/null 2>&1; then
              INGRESS_CREATED=true
              break
            fi

            sleep 5
          done

          if [[ "${INGRESS_CREATED}" != "true" ]]; then
            echo "::error::Ingress ${EDF_NAMESPACE}/${EDF_INGRESS_NAME} was not created."
            kubectl get applications -n "${ARGOCD_NAMESPACE}" -o wide || true
            exit 1
          fi

          echo "Waiting for ALB hostname..."

          ALB_HOSTNAME=""
          for attempt in $(seq 1 120); do
            ALB_HOSTNAME="$(
              kubectl get ingress "${EDF_INGRESS_NAME}" \
                -n "${EDF_NAMESPACE}" \
                -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || true
            )"

            if [[ -n "${ALB_HOSTNAME}" ]]; then
              break
            fi

            sleep 5
          done

          if [[ -z "${ALB_HOSTNAME}" ]]; then
            echo "::error::ALB hostname was not assigned within 10 minutes."
            kubectl describe ingress "${EDF_INGRESS_NAME}" -n "${EDF_NAMESPACE}" || true
            kubectl logs \
              -n kube-system \
              deployment/aws-load-balancer-controller \
              --since=15m || true
            exit 1
          fi

          echo "ALB_HOSTNAME=${ALB_HOSTNAME}" >> "${GITHUB_ENV}"
          echo "ALB hostname: ${ALB_HOSTNAME}"

      - name: Show bootstrap result
        shell: bash
        run: |
          set -euo pipefail

          echo '=== Namespaces ==='
          kubectl get namespace "${EDF_NAMESPACE}" "${ARGOCD_NAMESPACE}"
          if [[ "${{ inputs.install_observability }}" == "true" ]]; then
            kubectl get namespace "${MONITORING_NAMESPACE}"
          fi

          echo '=== Cluster add-ons ==='
          kubectl get deployment \
            -n kube-system \
            aws-load-balancer-controller

          if [[ "${{ inputs.install_observability }}" == "true" ]]; then
            kubectl get deployment -n kube-system metrics-server
          fi

          echo '=== ArgoCD ==='
          kubectl get deployment argocd-server argocd-repo-server \
            -n "${ARGOCD_NAMESPACE}"
          kubectl get applications.argoproj.io \
            -n "${ARGOCD_NAMESPACE}"

          echo '=== EDF workload ==='
          kubectl get pods -n "${EDF_NAMESPACE}" -o wide || true

          echo '=== Network ==='
          echo "EKS VPC: ${VPC_ID}"
          echo "ALB: ${ALB_HOSTNAME:-not-assigned}"

          kubectl get ingress "${EDF_INGRESS_NAME}" \
            -n "${EDF_NAMESPACE}" \
            -o wide

