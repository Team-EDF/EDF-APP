name: Deploy EDF Server

on:
  workflow_dispatch:
    inputs:
      backend_ref:
        description: "EDF-BE에서 배포할 Branch 또는 Tag"
        required: true
        default: "main"
        type: string
      ai_ref:
        description: "EDF-AI에서 배포할 Branch 또는 Tag"
        required: true
        default: "main"
        type: string

concurrency:
  group: edf-server-deploy
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-2
  TARGET_BRANCH: main

jobs:
  build-push-and-update-gitops:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: write

    steps:
      - name: Checkout EDF-APP
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          submodules: false
          token: ${{ secrets.GH_PAT }}

      - name: Validate required values
        env:
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GIT_USER_NAME: ${{ vars.USER_NAME }}
          GIT_USER_EMAIL: ${{ vars.USER_EMAIL }}
        shell: bash
        run: |
          set -euo pipefail

          required_names=(
            AWS_ROLE_ARN
            GH_PAT
            GIT_USER_NAME
            GIT_USER_EMAIL
          )

          for name in "${required_names[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Required GitHub Secret or Variable is missing: ${name}"
              exit 1
            fi
          done

      - name: Validate server submodule registration
        shell: bash
        run: |
          set -euo pipefail

          test -f .gitmodules || {
            echo "::error::.gitmodules file does not exist."
            exit 1
          }

          REGISTERED_PATHS="$(
            git config \
              --file .gitmodules \
              --get-regexp '\.path$' |
            awk '{print $2}'
          )"

          echo "Registered submodule paths:"
          echo "${REGISTERED_PATHS}"

          for path in backend/EDF-BE ai/EDF-AI; do
            if ! grep -Fxq "${path}" <<< "${REGISTERED_PATHS}"; then
              echo "::error::Submodule path is not registered in EDF-APP: ${path}"
              exit 1
            fi
          done

      - name: Checkout latest Backend and AI sources
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          BACKEND_REF: ${{ inputs.backend_ref }}
          AI_REF: ${{ inputs.ai_ref }}
        shell: bash
        run: |
          set -euo pipefail

          cleanup_git_auth() {
            git config --global --unset-all \
              url."https://x-access-token:${GH_PAT}@github.com/".insteadOf \
              || true
          }

          trap cleanup_git_auth EXIT

          git config --global \
            url."https://x-access-token:${GH_PAT}@github.com/".insteadOf \
            "git@github.com:"

          git submodule sync --recursive

          git submodule update \
            --init \
            --recursive \
            backend/EDF-BE \
            ai/EDF-AI

          git -C backend/EDF-BE fetch \
            --depth 1 \
            origin "${BACKEND_REF}"

          git -C backend/EDF-BE checkout \
            --detach FETCH_HEAD

          git -C ai/EDF-AI fetch \
            --depth 1 \
            origin "${AI_REF}"

          git -C ai/EDF-AI checkout \
            --detach FETCH_HEAD

          BACKEND_COMMIT="$(
            git -C backend/EDF-BE rev-parse HEAD
          )"

          AI_COMMIT="$(
            git -C ai/EDF-AI rev-parse HEAD
          )"

          BACKEND_IMAGE_TAG="${BACKEND_COMMIT:0:7}"
          AI_IMAGE_TAG="${AI_COMMIT:0:7}"

          {
            echo "BACKEND_COMMIT=${BACKEND_COMMIT}"
            echo "AI_COMMIT=${AI_COMMIT}"
            echo "BACKEND_IMAGE_TAG=${BACKEND_IMAGE_TAG}"
            echo "AI_IMAGE_TAG=${AI_IMAGE_TAG}"
          } >> "${GITHUB_ENV}"

          echo "Backend source: ${BACKEND_COMMIT}"
          echo "AI source: ${AI_COMMIT}"

      - name: Validate checked-out source files
        shell: bash
        run: |
          set -euo pipefail

          git submodule status --recursive

          if [[ ! -f backend/EDF-BE/build.gradle && \
                ! -f backend/EDF-BE/build.gradle.kts ]]; then
            echo "::error::Backend build.gradle or build.gradle.kts not found."
            exit 1
          fi

          test -d backend/EDF-BE/src || {
            echo "::error::backend/EDF-BE/src directory not found."
            exit 1
          }

          test -f ai/EDF-AI/requirements.txt || {
            echo "::error::ai/EDF-AI/requirements.txt not found."
            exit 1
          }

          test -f ai/EDF-AI/main.py || {
            echo "::error::ai/EDF-AI/main.py not found."
            exit 1
          }

          test -f backend/Dockerfile || {
            echo "::error::backend/Dockerfile not found."
            exit 1
          }

          test -f ai/Dockerfile || {
            echo "::error::ai/Dockerfile not found."
            exit 1
          }

          test -f k8s/backend/deployment.yml || {
            echo "::error::k8s/backend/deployment.yml not found."
            exit 1
          }

          test -f k8s/ai/deployment.yml || {
            echo "::error::k8s/ai/deployment.yml not found."
            exit 1
          }

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve and validate ECR
        shell: bash
        run: |
          set -euo pipefail

          AWS_ACCOUNT_ID="$(
            aws sts get-caller-identity \
              --query Account \
              --output text
          )"

          ECR_REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"

          echo "ECR_REGISTRY=${ECR_REGISTRY}" >> "${GITHUB_ENV}"

          aws ecr describe-repositories \
            --repository-names edf-backend \
            > /dev/null

          aws ecr describe-repositories \
            --repository-names edf-ai \
            > /dev/null

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Prepare Docker build contexts
        shell: bash
        run: |
          set -euo pipefail

          CONTEXT_ROOT="${RUNNER_TEMP}/edf-build-contexts"

          rm -rf "${CONTEXT_ROOT}"
          mkdir -p \
            "${CONTEXT_ROOT}/backend" \
            "${CONTEXT_ROOT}/ai"

          rsync -a \
            --delete \
            --exclude='.git' \
            backend/EDF-BE/ \
            "${CONTEXT_ROOT}/backend/"

          rsync -a \
            --delete \
            --exclude='.git' \
            ai/EDF-AI/ \
            "${CONTEXT_ROOT}/ai/"

          if [[ -f backend/.dockerignore ]]; then
            cp backend/.dockerignore \
              "${CONTEXT_ROOT}/backend/.dockerignore"
          fi

          if [[ -f ai/.dockerignore ]]; then
            cp ai/.dockerignore \
              "${CONTEXT_ROOT}/ai/.dockerignore"
          fi

          echo "CONTEXT_ROOT=${CONTEXT_ROOT}" >> "${GITHUB_ENV}"

      - name: Build and push Backend image
        shell: bash
        run: |
          set -euo pipefail

          BACKEND_IMAGE="${ECR_REGISTRY}/edf-backend:${BACKEND_IMAGE_TAG}"

          docker build \
            --pull \
            --file backend/Dockerfile \
            --tag "${BACKEND_IMAGE}" \
            "${CONTEXT_ROOT}/backend"

          docker push "${BACKEND_IMAGE}"

          echo "BACKEND_IMAGE=${BACKEND_IMAGE}" >> "${GITHUB_ENV}"

      - name: Build and push AI image
        shell: bash
        run: |
          set -euo pipefail

          AI_IMAGE="${ECR_REGISTRY}/edf-ai:${AI_IMAGE_TAG}"

          docker build \
            --pull \
            --file ai/Dockerfile \
            --tag "${AI_IMAGE}" \
            "${CONTEXT_ROOT}/ai"

          docker push "${AI_IMAGE}"

          echo "AI_IMAGE=${AI_IMAGE}" >> "${GITHUB_ENV}"

      - name: Install yq
        shell: bash
        run: |
          set -euo pipefail

          sudo wget \
            --quiet \
            --output-document=/usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/download/v4.44.2/yq_linux_amd64

          sudo chmod +x /usr/local/bin/yq
          yq --version

      - name: Update Kubernetes image tags
        shell: bash
        run: |
          set -euo pipefail

          BACKEND_IMAGE="${BACKEND_IMAGE}" \
            yq -i '
              (
                .spec.template.spec.containers[]
                | select(.name == "backend-container").image
              ) = strenv(BACKEND_IMAGE)
            ' k8s/backend/deployment.yml

          AI_IMAGE="${AI_IMAGE}" \
            yq -i '
              (
                .spec.template.spec.containers[]
                | select(.name == "ai-container").image
              ) = strenv(AI_IMAGE)
            ' k8s/ai/deployment.yml

      - name: Commit GitOps state
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "${{ vars.USER_NAME }}"
          git config user.email "${{ vars.USER_EMAIL }}"

          git add \
            backend/EDF-BE \
            ai/EDF-AI \
            k8s/backend/deployment.yml \
            k8s/ai/deployment.yml

          if git diff --cached --quiet; then
            echo "No GitOps state changes to commit."
            exit 0
          fi

          git commit \
            -m "chore(deploy): backend ${BACKEND_IMAGE_TAG}, ai ${AI_IMAGE_TAG} [skip ci]"

          git pull \
            --rebase \
            origin "${TARGET_BRANCH}"

          git push \
            origin \
            "HEAD:${TARGET_BRANCH}"

      - name: Deployment summary
        shell: bash
        run: |
          {
            echo "## EDF Server Deployment"
            echo ""
            echo "- Backend source: \`${BACKEND_COMMIT}\`"
            echo "- Backend image: \`${BACKEND_IMAGE}\`"
            echo "- AI source: \`${AI_COMMIT}\`"
            echo "- AI image: \`${AI_IMAGE}\`"
            echo "- ArgoCD target branch: \`${TARGET_BRANCH}\`"
          } >> "${GITHUB_STEP_SUMMARY}"