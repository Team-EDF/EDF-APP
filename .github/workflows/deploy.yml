name: Deploy EDF Platform

on:
  workflow_dispatch:
    inputs:
      deploy_server:
        description: "Backend와 AI를 EKS에 배포"
        required: true
        default: true
        type: boolean
      build_android:
        description: "Android Release APK/AAB 빌드 (서버 1차 배포 중에는 false 권장)"
        required: true
        default: false
        type: boolean
      publish_android:
        description: "빌드한 AAB를 Google Play에 업로드"
        required: true
        default: false
        type: boolean
      backend_ref:
        description: "EDF-BE Branch 또는 Tag"
        required: true
        default: "main"
        type: string
      ai_ref:
        description: "EDF-AI Branch 또는 Tag"
        required: true
        default: "main"
        type: string
      frontend_ref:
        description: "EDF-FE Branch 또는 Tag"
        required: true
        default: "main"
        type: string
      android_version_name:
        description: "Android versionName"
        required: true
        default: "1.0.0"
        type: string
      android_version_code:
        description: "Android versionCode. 비워두면 Workflow run number 사용"
        required: false
        default: ""
        type: string
      play_track:
        description: "Google Play Track"
        required: true
        default: "internal"
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
      play_status:
        description: "Google Play Release 상태"
        required: true
        default: "completed"
        type: choice
        options:
          - draft
          - completed

concurrency:
  group: edf-platform-deploy
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-2
  EKS_CLUSTER_NAME: edf-cluster
  EDF_NAMESPACE: edf
  ARGOCD_NAMESPACE: argocd
  TARGET_BRANCH: main
  NODE_VERSION: "22.11.0"
  JAVA_VERSION: "17"
  ANDROID_PACKAGE_NAME: com.greenstep

jobs:
  deploy-server:
    if: ${{ inputs.deploy_server == true }}
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: write

    outputs:
      backend_commit: ${{ steps.source_versions.outputs.backend_commit }}
      ai_commit: ${{ steps.source_versions.outputs.ai_commit }}
      backend_image: ${{ steps.images.outputs.backend_image }}
      ai_image: ${{ steps.images.outputs.ai_image }}

    steps:
      - name: Checkout EDF-APP
        uses: actions/checkout@v6
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          token: ${{ github.token }}
          persist-credentials: false

      - name: Checkout EDF-BE
        uses: actions/checkout@v6
        with:
          repository: Team-EDF/EDF-BE
          ref: ${{ inputs.backend_ref }}
          path: sources/backend
          fetch-depth: 1
          token: ${{ secrets.GH_PAT }}
          persist-credentials: false

      - name: Checkout EDF-AI
        uses: actions/checkout@v6
        with:
          repository: Team-EDF/EDF-AI
          ref: ${{ inputs.ai_ref }}
          path: sources/ai
          fetch-depth: 1
          token: ${{ secrets.GH_PAT }}
          persist-credentials: false

      - name: Validate server deployment values
        env:
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GIT_USER_NAME: ${{ vars.USER_NAME }}
          GIT_USER_EMAIL: ${{ vars.USER_EMAIL }}
        shell: bash
        run: |
          set -euo pipefail

          required_names=(
            AWS_ROLE_ARN
            GH_PAT
            GIT_USER_NAME
            GIT_USER_EMAIL
          )

          for name in "${required_names[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Required GitHub Secret or Variable is missing: ${name}"
              exit 1
            fi
          done

          test -f backend/Dockerfile
          test -f ai/Dockerfile
          test -f k8s/backend/deployment.yml
          test -f k8s/ai/deployment.yml

          for file in build.gradle settings.gradle gradlew; do
            if [[ ! -f "sources/backend/${file}" ]]; then
              echo "::error::EDF-BE ${file} not found. The current Backend Dockerfile expects a Groovy Gradle project."
              exit 1
            fi
          done

          test -d sources/backend/gradle || {
            echo "::error::EDF-BE Gradle wrapper directory not found."
            exit 1
          }

          test -d sources/backend/src || {
            echo "::error::EDF-BE src directory not found."
            exit 1
          }

          test -f sources/ai/requirements.txt || {
            echo "::error::EDF-AI requirements.txt not found."
            exit 1
          }

          test -f sources/ai/main.py || {
            echo "::error::EDF-AI main.py not found."
            exit 1
          }

      - name: Resolve source versions
        id: source_versions
        shell: bash
        run: |
          set -euo pipefail

          BACKEND_COMMIT="$(git -C sources/backend rev-parse HEAD)"
          AI_COMMIT="$(git -C sources/ai rev-parse HEAD)"

          echo "backend_commit=${BACKEND_COMMIT}" >> "${GITHUB_OUTPUT}"
          echo "ai_commit=${AI_COMMIT}" >> "${GITHUB_OUTPUT}"
          echo "BACKEND_IMAGE_TAG=${BACKEND_COMMIT:0:7}" >> "${GITHUB_ENV}"
          echo "AI_IMAGE_TAG=${AI_COMMIT:0:7}" >> "${GITHUB_ENV}"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Update EKS kubeconfig
        shell: bash
        run: |
          set -euo pipefail

          aws eks update-kubeconfig \
            --region "${AWS_REGION}" \
            --name "${EKS_CLUSTER_NAME}"

      - name: Cluster preflight
        shell: bash
        run: |
          set -euo pipefail

          echo '=== Nodes ==='
          kubectl get nodes -L node.kubernetes.io/instance-type
          kubectl get nodes \
            -o custom-columns='NAME:.metadata.name,TYPE:.metadata.labels.node\.kubernetes\.io/instance-type,READY:.status.conditions[?(@.type=="Ready")].status,POD_CAPACITY:.status.capacity.pods'

          TOTAL_NODES="$(kubectl get nodes --no-headers | wc -l | tr -d ' ')"
          READY_NODES="$(kubectl get nodes --no-headers | awk '$2 == "Ready" {count++} END {print count+0}')"

          if [[ "${READY_NODES}" -lt 2 || "${READY_NODES}" -ne "${TOTAL_NODES}" ]]; then
            echo "::error::Cluster is not ready for a deployment (${READY_NODES}/${TOTAL_NODES} Ready nodes)."
            exit 1
          fi

          echo '=== CNI ==='
          kubectl rollout status daemonset/aws-node \
            -n kube-system \
            --timeout=3m

          echo '=== Load Balancer Controller ==='
          kubectl rollout status deployment/aws-load-balancer-controller \
            -n kube-system \
            --timeout=3m

          echo '=== ArgoCD ==='
          kubectl rollout status deployment/argocd-server \
            -n "${ARGOCD_NAMESPACE}" \
            --timeout=3m
          kubectl rollout status deployment/argocd-repo-server \
            -n "${ARGOCD_NAMESPACE}" \
            --timeout=3m

          echo '=== Existing Pending Pods (informational) ==='
          kubectl get pods -A --field-selector=status.phase=Pending -o wide || true

      - name: Resolve and validate ECR
        shell: bash
        run: |
          set -euo pipefail

          AWS_ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          ECR_REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          echo "ECR_REGISTRY=${ECR_REGISTRY}" >> "${GITHUB_ENV}"

          aws ecr describe-repositories --repository-names edf-backend > /dev/null
          aws ecr describe-repositories --repository-names edf-ai > /dev/null

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Backend image
        shell: bash
        run: |
          set -euo pipefail

          BACKEND_IMAGE="${ECR_REGISTRY}/edf-backend:${BACKEND_IMAGE_TAG}"

          docker build \
            --pull \
            --file backend/Dockerfile \
            --tag "${BACKEND_IMAGE}" \
            sources/backend

          docker push "${BACKEND_IMAGE}"
          echo "BACKEND_IMAGE=${BACKEND_IMAGE}" >> "${GITHUB_ENV}"

      - name: Build and push AI image
        shell: bash
        run: |
          set -euo pipefail

          AI_IMAGE="${ECR_REGISTRY}/edf-ai:${AI_IMAGE_TAG}"

          docker build \
            --pull \
            --file ai/Dockerfile \
            --tag "${AI_IMAGE}" \
            sources/ai

          docker push "${AI_IMAGE}"
          echo "AI_IMAGE=${AI_IMAGE}" >> "${GITHUB_ENV}"

      - name: Export image outputs
        id: images
        shell: bash
        run: |
          echo "backend_image=${BACKEND_IMAGE}" >> "${GITHUB_OUTPUT}"
          echo "ai_image=${AI_IMAGE}" >> "${GITHUB_OUTPUT}"

      - name: Install yq
        shell: bash
        run: |
          set -euo pipefail

          sudo wget --quiet \
            --output-document=/usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/download/v4.44.2/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          yq --version

      - name: Update Kubernetes image tags
        shell: bash
        run: |
          set -euo pipefail

          BACKEND_IMAGE="${BACKEND_IMAGE}" yq -i '
            (.spec.template.spec.containers[]
              | select(.name == "backend-container").image) = strenv(BACKEND_IMAGE)
          ' k8s/backend/deployment.yml

          AI_IMAGE="${AI_IMAGE}" yq -i '
            (.spec.template.spec.containers[]
              | select(.name == "ai-container").image) = strenv(AI_IMAGE)
          ' k8s/ai/deployment.yml

      - name: Commit GitOps manifests
        env:
          GITHUB_PUSH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "${{ vars.USER_NAME }}"
          git config user.email "${{ vars.USER_EMAIL }}"

          git add \
            k8s/backend/deployment.yml \
            k8s/ai/deployment.yml

          if git diff --cached --quiet; then
            echo "No GitOps manifest changes to commit."
            exit 0
          fi

          git commit -m "chore(deploy): backend ${BACKEND_IMAGE_TAG}, ai ${AI_IMAGE_TAG} [skip ci]"

          AUTH_HEADER="$(
            printf 'x-access-token:%s' "${GITHUB_PUSH_TOKEN}" \
              | base64 \
              | tr -d '\n'
          )"

          git \
            -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${AUTH_HEADER}" \
            pull --rebase \
            "https://github.com/${GITHUB_REPOSITORY}.git" \
            "${TARGET_BRANCH}"

          git \
            -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${AUTH_HEADER}" \
            push \
            "https://github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:${TARGET_BRANCH}"

      - name: Refresh ArgoCD applications
        shell: bash
        run: |
          set -euo pipefail

          kubectl annotate application backend-app \
            -n "${ARGOCD_NAMESPACE}" \
            argocd.argoproj.io/refresh=hard \
            --overwrite

          kubectl annotate application ai-app \
            -n "${ARGOCD_NAMESPACE}" \
            argocd.argoproj.io/refresh=hard \
            --overwrite

      - name: Wait for ArgoCD to apply new images
        shell: bash
        run: |
          set -euo pipefail

          wait_for_image() {
            local deployment="$1"
            local container="$2"
            local expected_image="$3"

            for attempt in $(seq 1 60); do
              current_image="$(
                kubectl get deployment "${deployment}" \
                  -n "${EDF_NAMESPACE}" \
                  -o "jsonpath={.spec.template.spec.containers[?(@.name=='${container}')].image}" \
                  2>/dev/null || true
              )"

              if [[ "${current_image}" == "${expected_image}" ]]; then
                echo "${deployment} now uses ${expected_image}"
                return 0
              fi

              echo "Waiting for ${deployment}: current='${current_image:-not-created}', expected='${expected_image}'"
              sleep 5
            done

            echo "::error::ArgoCD did not apply ${expected_image} to ${deployment} within 5 minutes."
            return 1
          }

          wait_for_image backend-depl backend-container "${BACKEND_IMAGE}"
          wait_for_image ai-depl ai-container "${AI_IMAGE}"

          kubectl rollout status deployment/backend-depl \
            -n "${EDF_NAMESPACE}" \
            --timeout=10m

          kubectl rollout status deployment/ai-depl \
            -n "${EDF_NAMESPACE}" \
            --timeout=10m

      - name: Collect server deployment diagnostics
        if: failure()
        shell: bash
        run: |
          set +e

          if ! command -v kubectl >/dev/null 2>&1; then
            echo "kubectl is not available; skipping cluster diagnostics."
            exit 0
          fi

          if ! kubectl cluster-info >/dev/null 2>&1; then
            echo "Kubernetes cluster is not reachable; skipping cluster diagnostics."
            exit 0
          fi

          echo '===== NODES ====='
          kubectl get nodes -o wide

          echo '===== ALL PODS ====='
          kubectl get pods -A -o wide

          echo '===== EDF DEPLOYMENTS ====='
          kubectl get deployment -n "${EDF_NAMESPACE}" -o wide

          echo '===== ARGOCD APPLICATIONS ====='
          kubectl get applications -n "${ARGOCD_NAMESPACE}" -o wide

          echo '===== RECENT EVENTS ====='
          kubectl get events -A --sort-by=.lastTimestamp | tail -n 120

          for app in backend ai; do
            echo "===== ${app^^} PODS ====="
            kubectl get pods -n "${EDF_NAMESPACE}" -l "app=${app}" -o wide

            POD="$(
              kubectl get pods -n "${EDF_NAMESPACE}" -l "app=${app}" \
                --sort-by=.metadata.creationTimestamp \
                -o jsonpath='{.items[-1:].metadata.name}' 2>/dev/null
            )"

            if [[ -n "${POD}" ]]; then
              echo "===== ${app^^} NEWEST POD: ${POD} ====="
              kubectl describe pod "${POD}" -n "${EDF_NAMESPACE}"
              kubectl logs "${POD}" -n "${EDF_NAMESPACE}" --tail=200
              kubectl logs "${POD}" -n "${EDF_NAMESPACE}" --previous --tail=200
            fi
          done

  build-and-publish-android:
    needs:
      - deploy-server
    if: >-
      ${{
        always() &&
        inputs.build_android == true &&
        (needs['deploy-server'].result == 'success' || needs['deploy-server'].result == 'skipped')
      }}
    runs-on: ubuntu-latest

    permissions:
      contents: read

    outputs:
      frontend_commit: ${{ steps.frontend_version.outputs.frontend_commit }}
      version_code: ${{ steps.android_version.outputs.version_code }}
      version_name: ${{ steps.android_version.outputs.version_name }}

    steps:
      - name: Checkout EDF-FE
        uses: actions/checkout@v6
        with:
          repository: Team-EDF/EDF-FE
          ref: ${{ inputs.frontend_ref }}
          fetch-depth: 1
          token: ${{ secrets.GH_PAT }}
          persist-credentials: false

      - name: Validate Android deployment values
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          ANDROID_BASE_URL: ${{ vars.ANDROID_BASE_URL }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          KAKAO_APP_KEY: ${{ secrets.KAKAO_NATIVE_APP_KEY }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          PUBLISH_ANDROID: ${{ inputs.publish_android }}
        shell: bash
        run: |
          set -euo pipefail

          required_names=(
            GH_PAT
            ANDROID_BASE_URL
            ANDROID_KEYSTORE_BASE64
            ANDROID_KEYSTORE_PASSWORD
            ANDROID_KEY_ALIAS
            ANDROID_KEY_PASSWORD
            GOOGLE_WEB_CLIENT_ID
            NAVER_CLIENT_ID
            NAVER_CLIENT_SECRET
            KAKAO_APP_KEY
          )

          for name in "${required_names[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Required Android Secret or Variable is missing: ${name}"
              exit 1
            fi
          done

          if [[ ! "${ANDROID_BASE_URL}" =~ ^https:// ]]; then
            echo "::error::ANDROID_BASE_URL must start with https:// for a Release build."
            exit 1
          fi

          if [[ "${PUBLISH_ANDROID}" == "true" && -z "${GOOGLE_PLAY_SERVICE_ACCOUNT_JSON:-}" ]]; then
            echo "::error::GOOGLE_PLAY_SERVICE_ACCOUNT_JSON is required when publish_android=true."
            exit 1
          fi

          test -f package.json
          test -f package-lock.json
          test -f android/gradlew
          test -f android/app/build.gradle
          test -f android/app/src/main/AndroidManifest.xml

      - name: Resolve Frontend source version
        id: frontend_version
        shell: bash
        run: |
          set -euo pipefail

          FRONTEND_COMMIT="$(git rev-parse HEAD)"
          echo "frontend_commit=${FRONTEND_COMMIT}" >> "${GITHUB_OUTPUT}"

      - name: Resolve Android version
        id: android_version
        env:
          REQUESTED_VERSION_CODE: ${{ inputs.android_version_code }}
          REQUESTED_VERSION_NAME: ${{ inputs.android_version_name }}
        shell: bash
        run: |
          set -euo pipefail

          VERSION_CODE="${REQUESTED_VERSION_CODE:-}"
          if [[ -z "${VERSION_CODE}" ]]; then
            VERSION_CODE="${GITHUB_RUN_NUMBER}"
          fi

          if [[ ! "${VERSION_CODE}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::android_version_code must be a positive integer."
            exit 1
          fi

          VERSION_NAME="${REQUESTED_VERSION_NAME}"
          if [[ -z "${VERSION_NAME}" ]]; then
            echo "::error::android_version_name must not be empty."
            exit 1
          fi

          echo "version_code=${VERSION_CODE}" >> "${GITHUB_OUTPUT}"
          echo "version_name=${VERSION_NAME}" >> "${GITHUB_OUTPUT}"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install JavaScript dependencies
        run: npm ci --no-audit --no-fund

      - name: Create production environment file
        env:
          ANDROID_BASE_URL: ${{ vars.ANDROID_BASE_URL }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          KAKAO_APP_KEY: ${{ secrets.KAKAO_NATIVE_APP_KEY }}
        shell: bash
        run: |
          set -euo pipefail

          cat > .env.production <<EOF
          BASE_URL=${ANDROID_BASE_URL}
          GOOGLE_WEB_CLIENT_ID=${GOOGLE_WEB_CLIENT_ID}
          GOOGLE_IOS_CLIENT_ID=
          NAVER_CLIENT_ID=${NAVER_CLIENT_ID}
          NAVER_CLIENT_SECRET=${NAVER_CLIENT_SECRET}
          KAKAO_APP_KEY=${KAKAO_APP_KEY}
          EOF

          chmod 600 .env.production

      - name: Decode Android upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail

          printf '%s' "${ANDROID_KEYSTORE_BASE64}" \
            | base64 --decode \
            > android/app/release.keystore

          chmod 600 android/app/release.keystore

      - name: Verify Android signing certificate
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        shell: bash
        run: |
          set -euo pipefail

          KEYSTORE="android/app/release.keystore"

          keytool -list -v \
            -keystore "${KEYSTORE}" \
            -alias "${ANDROID_KEY_ALIAS}" \
            -storepass "${ANDROID_KEYSTORE_PASSWORD}" \
            | grep -E 'Alias name:|SHA1:|SHA256:' \
            | tee signing-fingerprints.txt

          KAKAO_KEY_HASH="$(
            keytool -exportcert \
              -keystore "${KEYSTORE}" \
              -alias "${ANDROID_KEY_ALIAS}" \
              -storepass "${ANDROID_KEYSTORE_PASSWORD}" \
              | openssl sha1 -binary \
              | openssl base64
          )"

          {
            echo "## Android signing information"
            echo ""
            echo '```text'
            cat signing-fingerprints.txt
            echo "Kakao key hash: ${KAKAO_KEY_HASH}"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test -- --runInBand

      - name: Build signed Release AAB and APK
        working-directory: android
        env:
          ENVFILE: ${{ github.workspace }}/.env.production
          ANDROID_KEYSTORE_FILE: ${{ github.workspace }}/android/app/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_VERSION_CODE: ${{ steps.android_version.outputs.version_code }}
          ANDROID_VERSION_NAME: ${{ steps.android_version.outputs.version_name }}
        shell: bash
        run: |
          set -euo pipefail

          chmod +x gradlew
          ./gradlew clean bundleRelease assembleRelease --no-daemon --stacktrace

      - name: Upload signed Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: greenstep-android-${{ steps.android_version.outputs.version_name }}-${{ steps.android_version.outputs.version_code }}
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/mapping/release/mapping.txt
            signing-fingerprints.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish AAB to Google Play
        if: ${{ inputs.publish_android == true }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.ANDROID_PACKAGE_NAME }}
          releaseFiles: android/app/build/outputs/bundle/release/*.aab
          track: ${{ inputs.play_track }}
          status: ${{ inputs.play_status }}
          releaseName: v${{ steps.android_version.outputs.version_name }}-${{ steps.android_version.outputs.version_code }}

      - name: Remove generated signing and environment files
        if: always()
        shell: bash
        run: |
          rm -f \
            .env.production \
            android/app/release.keystore

  deployment-summary:
    needs:
      - deploy-server
      - build-and-publish-android
    if: always()
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Write deployment summary
        shell: bash
        run: |
          {
            echo "## EDF Deployment Result"
            echo ""
            echo "- Server job: \`${{ needs['deploy-server'].result }}\`"
            echo "- Android job: \`${{ needs['build-and-publish-android'].result }}\`"
            echo "- Backend commit: \`${{ needs['deploy-server'].outputs.backend_commit }}\`"
            echo "- AI commit: \`${{ needs['deploy-server'].outputs.ai_commit }}\`"
            echo "- Frontend commit: \`${{ needs['build-and-publish-android'].outputs.frontend_commit }}\`"
            echo "- Android version: \`${{ needs['build-and-publish-android'].outputs.version_name }} (${{ needs['build-and-publish-android'].outputs.version_code }})\`"
            echo "- Google Play requested: \`${{ inputs.publish_android }}\`"
            echo "- Google Play track: \`${{ inputs.play_track }}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
